[server]
APP_NAME = ProGit
DOMAIN = progit.local
HTTP_PORT = 3000
HTTPS_PORT = 3443
ROOT_URL = https://progit.local/
PROTOCOL = https
OFFLINE_MODE = false
CERT_FILE = custom/https/cert.pem
KEY_FILE = custom/https/key.pem
GENERATE_LOCAL_CERT = true
REDIRECT_OTHER_PORT = true
HSTS_MAX_AGE = 31536000

[database]
TYPE = sqlite
PATH = ./data/progit.db
WAL_MODE = true
BUSY_TIMEOUT = 5000

[repository]
ROOT = ./data/repositories
MAX_CREATION_LIMIT = -1

[organization]
MAX_CREATION_LIMIT = -1

[security]
INSTALL_LOCK = false
SECRET_KEY = CHANGE_THIS_TO_A_SECURE_RANDOM_VALUE
COOKIE_SECURE = false

[ssh]
ENABLED = true
PORT = 2222
LISTEN_HOST = 0.0.0.0
KEY_PATH = ./data/ssh/progit_ed25519

[log]
MODE = console
LEVEL = info

