[server]
APP_NAME = ProGit
DOMAIN = localhost
HTTP_PORT = 3001
ROOT_URL = http://localhost:3001/
PROTOCOL = http
OFFLINE_MODE = false

[database]
TYPE = sqlite
PATH = ./data/progit.db
WAL_MODE = true
BUSY_TIMEOUT = 5000

[repository]
ROOT = ./data/repositories

[security]
INSTALL_LOCK = false
SECRET_KEY = CHANGE_THIS_TO_A_SECURE_RANDOM_VALUE
COOKIE_SECURE = false

[ssh]
ENABLED = true
PORT = 2222
LISTEN_HOST = 0.0.0.0
KEY_PATH = ./data/ssh/progit_ed25519

[log]
MODE = console
LEVEL = info

