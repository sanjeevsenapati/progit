[server]
APP_NAME = ProGit Secure
DOMAIN = secure.git.local
HTTP_PORT = 3000
HTTPS_PORT = 3443
ROOT_URL = https://secure.git.local:3443/
PROTOCOL = https
OFFLINE_MODE = false
CERT_FILE = custom/https/cert.pem
KEY_FILE = custom/https/key.pem
GENERATE_LOCAL_CERT = true
ENABLE_ACME = false
ACME_DOMAIN = 
ACME_EMAIL = 
ACME_DIR = custom/https/acme
REDIRECT_OTHER_PORT = true
HSTS_MAX_AGE = 31536000

[database]
TYPE = sqlite
PATH = /var/folders/15/851gfxsj73z3jc47dcm4cv5m0000gn/T/progit-api-test-3154911123/test.db
WAL_MODE = true
BUSY_TIMEOUT = 5000

[repository]
ROOT = /var/folders/15/851gfxsj73z3jc47dcm4cv5m0000gn/T/progit-api-test-3154911123/repos

[security]
INSTALL_LOCK = true
SECRET_KEY = progit_default_insecure_key_change_me
COOKIE_SECURE = true

[ssh]
ENABLED = true
PORT = 2222
LISTEN_HOST = 0.0.0.0
KEY_PATH = ./data/ssh/progit_ed25519

[log]
MODE = console
LEVEL = info
