name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build Web Frontend
        run: |
          cd web
          npm ci
          npm run build
          cd ..
          rm -rf internal/ui/dist
          cp -r web/dist internal/ui/dist

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.ref_name }}" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.1.0"
          fi
          # Strip leading 'v'
          RAW_VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${RAW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and Package Cross-Platform Binaries
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          mkdir -p dist/release
          LDFLAGS="-s -w -X main.Version=${VERSION}"
          TMP_DIR=$(mktemp -d)

          # Targets: OS:ARCH:FORMAT:BINARY
          TARGETS=(
            "darwin:arm64:tar.gz:progit"
            "darwin:amd64:tar.gz:progit"
            "linux:amd64:tar.gz:progit"
            "linux:arm64:tar.gz:progit"
            "windows:amd64:zip:progit.exe"
            "windows:arm64:zip:progit.exe"
          )

          for target in "${TARGETS[@]}"; do
            IFS=":" read -r GOOS GOARCH FORMAT BINARY_NAME <<< "$target"
            TARGET_NAME="progit_${VERSION}_${GOOS}_${GOARCH}"
            PKG_DIR="${TMP_DIR}/${TARGET_NAME}"
            mkdir -p "${PKG_DIR}"

            echo "Building ${GOOS}/${GOARCH}..."
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build \
              -trimpath \
              -ldflags="${LDFLAGS}" \
              -o "${PKG_DIR}/${BINARY_NAME}" \
              ./cmd/progit

            [ -f README.md ] && cp README.md "${PKG_DIR}/"
            [ -f config.example.yaml ] && cp config.example.yaml "${PKG_DIR}/"

            if [ "${FORMAT}" = "tar.gz" ]; then
              tar -czf "dist/release/${TARGET_NAME}.tar.gz" -C "${TMP_DIR}" "${TARGET_NAME}"
            elif [ "${FORMAT}" = "zip" ]; then
              (cd "${TMP_DIR}" && zip -q -r "${GITHUB_WORKSPACE}/dist/release/${TARGET_NAME}.zip" "${TARGET_NAME}")
            fi
          done

          # Checksums
          cd dist/release
          sha256sum progit_* > checksums.txt
          ls -lh

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: ProGit ${{ steps.get_version.outputs.tag }}
          files: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
