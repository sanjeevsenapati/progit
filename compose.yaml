services:
  progit:
    image: localhost/progit:latest
    build:
      context: .
      dockerfile: Containerfile
    container_name: progit
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "2222:2222"
    environment:
      - PROGIT_APP_NAME=ProGit
      - PROGIT_DOMAIN=localhost
      - PROGIT_HTTP_PORT=3000
      - PROGIT_ROOT_URL=http://localhost:3000/
      - PROGIT_DB_PATH=/data/db/progit.db
      - PROGIT_REPO_ROOT=/data/repositories
      - PROGIT_SSH_ENABLED=true
      - PROGIT_SSH_PORT=2222
      - PROGIT_SECRET_KEY=change_this_to_a_production_random_secret
    volumes:
      - progit-data:/data/db:Z
      - progit-repositories:/data/repositories:Z
      - progit-config:/data/config:Z
      - progit-logs:/data/logs:Z
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  progit-data:
  progit-repositories:
  progit-config:
  progit-logs:

