<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Background Decorative Glowing Circles -->
  <circle cx="100" cy="100" r="180" fill="#10b981" opacity="0.08" filter="url(#glow)" />
  <circle cx="1100" cy="500" r="220" fill="#3b82f6" opacity="0.06" filter="url(#glow)" />

  <!-- Git Branching Node Graphic in Background -->
  <g stroke="#30363d" stroke-width="3" fill="none" opacity="0.4">
    <path d="M 900 120 L 900 480 M 900 240 Q 1020 280 1020 360 L 1020 480" />
    <circle cx="900" cy="160" r="12" fill="#10b981" stroke="#0d1117" stroke-width="4" />
    <circle cx="900" cy="240" r="12" fill="#34d399" stroke="#0d1117" stroke-width="4" />
    <circle cx="1020" cy="360" r="12" fill="#38bdf8" stroke="#0d1117" stroke-width="4" />
    <circle cx="900" cy="440" r="12" fill="#10b981" stroke="#0d1117" stroke-width="4" />
    <circle cx="1020" cy="440" r="12" fill="#818cf8" stroke="#0d1117" stroke-width="4" />
  </g>

  <!-- Brand Logo & Badge -->
  <g transform="translate(100, 90)">
    <!-- Git Branch Icon inside Badge -->
    <rect width="72" height="72" rx="16" fill="url(#accent)" />
    <svg x="14" y="14" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#0d1117" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="18" r="3"/>
      <circle cx="6" cy="6" r="3"/>
      <path d="M6 9v12"/>
      <path d="M18 9a9 9 0 0 0-9 9"/>
    </svg>
    <text x="92" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#f0f6fc" letter-spacing="-1">ProGit</text>
    <rect x="245" y="18" width="160" height="34" rx="17" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.5" />
    <text x="325" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle">v1.2.0 PURE GO</text>
  </g>

  <!-- Main Headline for SEO -->
  <g transform="translate(100, 240)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#f0f6fc" letter-spacing="-1.5">
      The Modern Self-Hosted Git Service
    </text>
    <text y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="600" fill="#10b981">
      Lightweight GitHub, Gogs &amp; Gitea Alternative
    </text>
    <text y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#8b949e">
      Zero CGO Dependencies &bull; &lt; 40 MB RAM &bull; Pure-Go SQLite WAL &bull; React 19 UI
    </text>
  </g>

  <!-- Feature Pills / Badges -->
  <g transform="translate(100, 440)">
    <!-- Pill 1 -->
    <rect width="180" height="48" rx="10" fill="#21262d" stroke="#30363d" />
    <text x="90" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#c9d1d9" text-anchor="middle">&lt; 40 MB Memory</text>

    <!-- Pill 2 -->
    <rect x="200" width="180" height="48" rx="10" fill="#21262d" stroke="#30363d" />
    <text x="290" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#c9d1d9" text-anchor="middle">Docker &amp; Podman</text>

    <!-- Pill 3 -->
    <rect x="400" width="180" height="48" rx="10" fill="#21262d" stroke="#30363d" />
    <text x="490" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#c9d1d9" text-anchor="middle">Git-Backed Wiki</text>

    <!-- Pill 4 -->
    <rect x="600" width="180" height="48" rx="10" fill="#21262d" stroke="#30363d" />
    <text x="690" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#c9d1d9" text-anchor="middle">ProGit Pages</text>

    <!-- Pill 5 -->
    <rect x="800" width="180" height="48" rx="10" fill="#21262d" stroke="#30363d" />
    <text x="890" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#c9d1d9" text-anchor="middle">Google &amp; OIDC SSO</text>
  </g>

  <!-- Footer Link -->
  <g transform="translate(100, 560)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#34d399">
      https://progit.co.in
    </text>
    <text x="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#6e7681">
      Open Source (MIT) &bull; Supported by PDIH &bull; Created by ProGit Team &amp; Sanjeev
    </text>
  </g>
</svg>
